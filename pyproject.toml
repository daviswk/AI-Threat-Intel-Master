[project]
name = "assurance-engine"
version = "0.1.0"
description = "Mastery-based learning and lab engine: 2nd-line privacy, security and AI technical assurance, fused with CTI."
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytest>=9.2",
    "duckdb>=2.0",
    "jsonschema>=4.26",
    "pymupdf4llm>=2.1",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

# Heavy, module-specific stacks are added just-in-time, with the learner's
# approval, as optional groups (for example: `ai` at Module 6, `redteam` at
# Module 7). Nothing large belongs in the base dependency list.

# Mission Control UI (/web): local FastAPI backend. Installed by default so
# that `uv sync --frozen` in scripts/_lib.sh never strips it from a running app.
[dependency-groups]
ui = [
    "fastapi>=0.163",
    "uvicorn>=0.54",
    "watchfiles>=1.3",
    "httpx>=0.28",
    "pyyaml>=6",
]

[tool.uv]
package = false
default-groups = ["ui"]

[tool.pytest.ini_options]
testpaths = ["assurance-harness"]
addopts = "-q -p no:cacheprovider"
